<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <style>
        body {text-align: center;
            font-family: Arial;}
        .calculator {background-color: black;
            width: 345px;
            margin: 25px auto;
            padding: 15px;
            border-radius: 15px;}

        input {width: 295px;
            height: 45px;
            font-size: 20px;
            margin-bottom: 5px;}
        button {width: 60px;
            height: 60px;
            margin: 5px;
            border-radius: 45%;
            border: none;
            font-size: 20px;}

        .number {background-color: #555454;
            color: white;}

        .operator {background-color: orange;
            color: white;}
        .Ac {background-color: lightgray;}
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" value="Welcome to Calculator"><br>
        <h2 style="color:white; text-align:right;">0</h2>
        <button class="Ac" >AC</button>
        <button class="Ac">←</button>
        <button clgitass="Ac">%</button>
        <button class="operator" >÷</button><br>

        <button class="number">7</button>
        <button class="number" >8</button>
        <button class="number">9</button>
        <button class="operator">X</button><br>

        <button class="number">4</button>
        <button class="number" >5</button>
        <button class="number">6</button>
        <button class="operator">-</button><br>
        <button class="number">1</button>
        <button class="number">2</button>
        <button class="number" >3</button>
        <button class="operator" >+</button><br>

        <button class="number">0</button>
        <button class="number" >00</button>
        <button class="number">. </button>
        <button class="operator">=</button>
    </div>
</body>
</html>
